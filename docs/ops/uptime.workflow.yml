name: Uptime probe (scheduled)

# STEP 34 §31/§33 - an INDEPENDENT outside-in check of the live site every 15 minutes, so an outage does not depend on the app noticing itself.
# It needs the repository secret EVIDENCE_URL (the public https address, no trailing slash). Without it the job does nothing and passes.
# A failed run makes GitHub e-mail the repository owner, and opens ONE issue labelled "outage" (it is not duplicated while that issue is open).
# Honest limits: GitHub may delay scheduled runs by several minutes under load, and it disables schedules after 60 days without repository
# activity. A dedicated uptime service (UptimeRobot, Better Stack...) is still recommended on top - see docs/runbooks/.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_URL: ${{ secrets.EVIDENCE_URL }}
    steps:
      - name: Probe the public pages
        id: probe
        run: |
          if [ -z "$TARGET_URL" ]; then echo "EVIDENCE_URL secret not set - nothing to probe."; exit 0; fi
          case "$TARGET_URL" in https://*) ;; *) echo "EVIDENCE_URL must be an https address"; exit 1;; esac
          fail=0
          check() { # path, expected status, max seconds
            out=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 20 "$TARGET_URL$1" || echo "000 99")
            code=${out%% *}; secs=${out##* }
            slow=$(awk -v t="$secs" -v m="$3" 'BEGIN{print (t>m)?"slow":"ok"}')
            echo "$1 -> HTTP $code in ${secs}s ($slow)"
            if [ "$code" != "$2" ] || [ "$slow" = "slow" ]; then fail=1; fi
          }
          check "/" 200 6
          check "/my-status" 200 6
          check "/admin/login" 200 6
          check "/api/health/live" 200 6
          check "/api/health/ready" 200 10
          # HTTPS hygiene: HSTS must be present and the certificate must have at least 14 days left.
          hsts=$(curl -sI --max-time 20 "$TARGET_URL/" | tr -d '\r' | grep -i '^strict-transport-security' || true)
          if [ -z "$hsts" ]; then echo "HSTS header missing"; fail=1; else echo "HSTS present"; fi
          host=${TARGET_URL#https://}; host=${host%%/*}
          if ! echo | openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null | openssl x509 -noout -checkend $((14*86400)); then
            echo "Certificate expires within 14 days (or could not be read)"; fail=1
          fi
          echo "failed=$fail" >> "$GITHUB_OUTPUT"
          exit $fail

      - name: Open an outage issue (once)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label outage --state open --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh label create outage --repo "$GITHUB_REPOSITORY" --color B60205 --description "Automatic uptime probe failed" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --label outage --title "Uptime probe failed" --body "The scheduled probe of the live site failed. See the run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Follow docs/runbooks/provider-outage.md and docs/runbooks/rollback.md. Close this issue when the site is healthy again."
          fi
